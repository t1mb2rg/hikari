[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hikari"
version = "0.1.0"
description = "A personal evolving intelligence system designed for continuous existence, memory, and growth."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "memory*", "events*"]
exclude = ["tests*", "brain*", "attention*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
