[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hikari"
version = "0.1.0"
description = "A personal evolving intelligence system designed for continuous existence, memory, and growth."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "lunar_python>=1.4.8,<2",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
hikari-resident = "resident.windows_host:main"
hikari-autostart = "resident.windows_autostart:main"
hikari-chat = "conversation.cli:main"
hikari-bakeoff = "conversation.bakeoff:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
windows-notify = [
  "Windows-Toasts>=1.3.1,<2; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "memory*", "events*", "attention*", "brain*", "awareness*", "personality*", "learning*", "actions*", "resident*", "conversation*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
personality = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
