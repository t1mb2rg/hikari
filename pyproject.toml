[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hikari"
version = "0.1.0"
description = "A personal evolving intelligence system designed for continuous existence, memory, and growth."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "lunar_python>=1.4.8,<2",
  "python-dotenv>=1.0,<2",
  "websockets>=15.0,<16",
]

[project.scripts]
hikari-resident = "resident.windows_host:main"
hikari-autostart = "resident.windows_autostart:main"
hikari-chat = "conversation.cli:main"
hikari-bakeoff = "conversation.bakeoff:main"
hikari-conversation-host = "conversation.remote:main"
hikari-qq = "integrations.qq_bridge.app:main"
hikari-deliver = "resident.delivery_cli:main"
hikari-presence = "resident.presence_cli:main"
hikari-soak = "resident.soak_cli:main"
hikari-doctor = "resident.doctor_cli:main"

[project.optional-dependencies]
qq = [
  "nonebot2[fastapi]>=2.5,<3",
  "nonebot-adapter-onebot>=2.4.6,<3",
]
dev = [
  "pytest>=8.0",
  "nonebot2[fastapi]>=2.5,<3",
  "nonebot-adapter-onebot>=2.4.6,<3",
]
windows-notify = [
  "Windows-Toasts>=1.3.1,<2; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "memory*", "user_model*", "events*", "attention*", "brain*", "awareness*", "personality*", "learning*", "actions*", "resident*", "conversation*", "integrations*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
personality = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
